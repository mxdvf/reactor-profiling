[package]
name = "reactor-tester"
version = "0.1.0"
edition = "2024"

[profile.release]
debug = true

[lib]
name = "chainpaxos"
crate-type = ["cdylib"]

[dependencies]
bincode = { version = "2", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
lazy_static = "1"
reactor_actor = { package = "reactor-actor", git = "https://github.com/mxdvf/reactor" }
reactor_macros = { package = "reactor-macros", git = "https://github.com/mxdvf/reactor" }
rand = "0.9"
